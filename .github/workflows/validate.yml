name: validate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r ingestion/requirements.txt
          pip install -r alerts/requirements.txt
          pip install -r api/requirements.txt
          pip install -r rtu/requirements.txt
          pip install -r notifications/requirements.txt
          pip install pytest

      - name: Run full validation (schemas + plans + crosscheck)
        run: python3 tools/validate.py all

      - name: Run negative test suite
        run: python3 tools/test_validator.py

      - name: Run ingestion unit tests
        run: python3 -m pytest ingestion/tests/ -v

      - name: Run alert engine unit tests
        run: python3 -m pytest alerts/tests/ -v

      - name: Run read API unit tests
        run: python3 -m pytest api/tests/ -v

      - name: Run RTU firmware unit tests
        run: python3 -m pytest rtu/tests/ -v

      - name: Run notifications service unit tests
        run: python3 -m pytest notifications/tests/ -v

      - name: SQL apply (schema + hypertable migration + seed) on TimescaleDB
        run: |
          docker run -d --name tsdb \
            -e POSTGRES_PASSWORD=pg \
            -p 5432:5432 \
            timescale/timescaledb:latest-pg15
          for i in $(seq 1 30); do
            PGPASSWORD=pg pg_isready -h 127.0.0.1 -U postgres && break || sleep 1
          done
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -f metadata/schema.sql
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -f metadata/migrations/002_measurement_hypertable.sql
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -f metadata/migrations/003_notifications.sql
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -f metadata/seeds/barragem_x.sql
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -f metadata/seeds/barragem_x_notification_routes.sql
          # Smoke insert to exercise the hypertable via an unique msg_id
          PGPASSWORD=pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO geo.measurement
            (t_sample, site_id, sensor_id, metric, value, quality, flags, msg_id, seq)
          VALUES
            (NOW(), 'mineradora-x-barragem-norte', 'pz-sec02-fund-01',
             'pressure_kpa', 312.4, 'GOOD', ARRAY[]::TEXT[],
             '01HK4X9Q8RX200000000000099', 1);
          SELECT count(*) FROM geo.measurement;
          SQL
          docker rm -f tsdb
