; Autodata RTU — ESP32 reference firmware
;
; Build:
;   pio run -e esp32dev
; Upload:
;   pio run -e esp32dev -t upload
; Monitor:
;   pio device monitor -b 115200
;
; Native test (runs on the host, no hardware):
;   pio test -e native
;
; Libraries:
;   - PubSubClient  : MQTT client for embedded
;   - ArduinoJson   : deterministic JSON serialization (needed for the signing
;                     contract — must produce the same bytes as the Python
;                     reference in rtu/src/rtu/signing.py)
;   - libsodium     : Ed25519 via NaCl. On ESP32 we link the port provided
;                     by ESP-IDF component registry.
;   - LittleFS      : flash-backed store-and-forward buffer.

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
lib_ldf_mode = chain+

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DAUTODATA_FIRMWARE=\"rtu-esp32-0.1.0\"
lib_deps =
    ${env.lib_deps}
    https://github.com/jedisct1/libsodium.git
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11

; Native target runs on the build host (no ESP32). Used to unit-test the
; canonical-JSON layer against the Python reference without a board.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -DARDUINO_JSON_HOST_COMPILE
lib_deps =
    bblanchon/ArduinoJson@^7.0
