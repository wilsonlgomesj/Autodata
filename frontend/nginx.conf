server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every unknown path returns index.html so that client-side
  # routes (react-router) resolve. Static assets still serve normally.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets aggressively; revalidate index.html on every load.
  location ~* \.(?:js|css|woff2|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
