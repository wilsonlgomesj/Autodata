# Mosquitto config for the development docker-compose stack only.
# Allows anonymous connections on the local broker so publishing tests
# are trivial. For anything beyond dev, see mqtt/acl.example.conf and use
# the EMQX/Mosquitto auth plugin with mTLS.

listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_type error
log_type warning
log_type notice
