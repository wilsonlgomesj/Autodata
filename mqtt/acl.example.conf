# MQTT ACL — exemplo para EMQX / Mosquitto
#
# Formato EMQX File ACL (emqx_auth_mnesia/acl.conf style):
#   {allow|deny, who, action, topic}
#
# Princípios:
#   1. Device só publica no escopo do próprio site/gateway/device.
#   2. Nenhum device se subscreve a outros sites.
#   3. Operador humano recebe acesso read-only ao próprio site.
#   4. Serviços backend têm acesso por papel, nunca por wildcard irrestrito.
#   5. Regra default: DENY.

## --- Devices (RTUs, gateways) ---

# Gateway "gw-bx-001" no site "mineradora-x-barragem-norte":
# Pode publicar telemetria/saúde/estado/ack do seu próprio escopo.
{allow, {client, "gw-bx-001"}, publish,
  ["tel/mineradora-x-barragem-norte/gw-bx-001/#",
   "state/mineradora-x-barragem-norte/gw-bx-001/#",
   "health/mineradora-x-barragem-norte/gw-bx-001/#",
   "ack/mineradora-x-barragem-norte/gw-bx-001/#"]}.

# E pode se subscrever a comandos destinados a si.
{allow, {client, "gw-bx-001"}, subscribe,
  ["cmd/mineradora-x-barragem-norte/gw-bx-001/#"]}.

# Deny explícito de qualquer outra publicação pelo gateway.
{deny, {client, "gw-bx-001"}, publish, ["#"]}.
{deny, {client, "gw-bx-001"}, subscribe, ["#"]}.


## --- Serviços de backend ---

# Ingestion: subscribe em toda telemetria e saúde, não publica nada.
{allow, {user, "svc-ingestion"}, subscribe,
  ["tel/+/+/+/+/meas",
   "tel/+/+/+/+/burst",
   "tel/+/+/+/+/qa",
   "health/#",
   "state/#"]}.
{deny, {user, "svc-ingestion"}, publish, ["#"]}.

# Alert engine: subscribe em telemetria; publica alertas.
{allow, {user, "svc-alert"}, subscribe, ["tel/+/+/+/+/meas"]}.
{allow, {user, "svc-alert"}, publish, ["alert/+/+/+"]}.

# Command dispatcher: publica comandos; subscribe em acks.
{allow, {user, "svc-cmd"}, publish, ["cmd/+/+/#"]}.
{allow, {user, "svc-cmd"}, subscribe, ["ack/+/+/+/#"]}.


## --- Operadores humanos (via bridge/API) ---

# Operador "op-alice" do site "mineradora-x-barragem-norte":
# Acesso read-only ao próprio site, incluindo alertas.
{allow, {user, "op-alice"}, subscribe,
  ["tel/mineradora-x-barragem-norte/#",
   "state/mineradora-x-barragem-norte/#",
   "health/mineradora-x-barragem-norte/#",
   "alert/mineradora-x-barragem-norte/#"]}.
{deny, {user, "op-alice"}, publish, ["#"]}.


## --- Regra default ---

{deny, all, all, ["#"]}.


## Observações de segurança
#
# 1. Autenticação é separada: TLS mutuo (cert por device), OIDC para usuários.
#    ACL pressupõe identidade confiável; nunca confie em 'client_id' sozinho.
#
# 2. Wildcards permitidos para serviços backend exigem segregação por VPC/rede
#    e contas de serviço distintas.
#
# 3. Rotação de credenciais: cert de device rotacionado a cada 12 meses via
#    provisionamento OTA; token de serviço via Vault com TTL curto.
#
# 4. Auditoria: habilitar hook de connection/publish para Kafka `audit.mqtt`,
#    retenção 5 anos.
