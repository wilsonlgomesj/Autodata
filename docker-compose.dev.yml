# Development-only stack. Brings up TimescaleDB, Mosquitto, and the ingestion
# service against a pre-seeded Barragem X site.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# First boot: the db service applies metadata/schema.sql + hypertable
# migration + seed via an init script mounted into /docker-entrypoint-initdb.d.
#
# NOT FOR PRODUCTION. Credentials are trivial; MQTT is anonymous; TLS is off.

services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: autodata
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: autodata
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./metadata/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./metadata/migrations/002_measurement_hypertable.sql:/docker-entrypoint-initdb.d/02-measurement.sql:ro
      - ./metadata/migrations/003_notifications.sql:/docker-entrypoint-initdb.d/03-notifications.sql:ro
      - ./metadata/seeds/barragem_x.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
      - ./metadata/seeds/barragem_x_notification_routes.sql:/docker-entrypoint-initdb.d/05-routes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodata -d autodata"]
      interval: 5s
      timeout: 5s
      retries: 12

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "2"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: svc-ingestion-dev
      MQTT_SUBSCRIBE_PATTERNS: "tel/+/+/+/+/meas,tel/+/+/+/+/burst"
      PG_DSN: postgresql://autodata:devpassword@db:5432/autodata
      DEAD_LETTER_ENABLED: "true"
      # Set REQUIRE_SIGNATURE=true once geo.device has a real public_key for
      # the RTU below. Dev default is false to allow bootstrap.
      REQUIRE_SIGNATURE: "false"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  rtu:
    build:
      context: .
      dockerfile: rtu/Dockerfile
    environment:
      SITE: mineradora-x-barragem-norte
      GATEWAY: gw-bx-001
      DEVICE: rtu-bx-c1
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      INTERVAL_S: "5"
      BUFFER_PATH: /tmp/rtu_buffer.sqlite
    depends_on:
      mqtt:
        condition: service_started

  alerts:
    build:
      context: .
      dockerfile: alerts/Dockerfile
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_SUBSCRIBE_PATTERNS: "tel/+/+/+/+/meas"
      PG_DSN: postgresql://autodata:devpassword@db:5432/autodata
      RULES_PATH: /app/rules
      SITE_ID: mineradora-x-barragem-norte
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  # Keycloak IdP — dev-only, runs in dev-file mode. For a real deployment,
  # use the production image with a managed Postgres and proper realm import.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PG_DSN: postgresql://autodata:devpassword@db:5432/autodata
      # Dev: auth bypassed for GraphiQL exploration. Flip AUTH_DISABLED=false
      # and provide the KEYCLOAK_* vars once a realm is imported.
      AUTH_DISABLED: "true"
      KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/autodata/protocol/openid-connect/certs"
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/autodata"
      KEYCLOAK_AUDIENCE: "autodata-api"
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    depends_on:
      db:
        condition: service_healthy

  # Fake SMTP server that catches outbound mail and exposes a web UI on 8025.
  # Used by the notification service in dev.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # UI

  notifications:
    build:
      context: .
      dockerfile: notifications/Dockerfile
    environment:
      PG_DSN: postgresql://autodata:devpassword@db:5432/autodata
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_SUBSCRIBE_PATTERNS: "alert/+/+/+"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_FROM: alerts@autodata.local
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      mailhog:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  grafana-data:
